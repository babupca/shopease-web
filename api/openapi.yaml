openapi: 3.0.3
info:
  title: ShopEase API
  version: 1.0.0
  description: Public REST API for the ShopEase storefront. Consumers - ShopEase web frontend (public/js), ShopEase mobile app, Fulfilment Service.
servers:
  - url: http://localhost:3000/api
security:
  - bearerAuth: []
paths:
  /health:
    get: { summary: Health check, security: [], tags: [Platform], responses: { '200': { description: Service is up } } }
  /auth/login:
    post:
      summary: Log in and obtain a session token
      tags: [Auth]
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses:
        '200': { description: Session created }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '423': { $ref: '#/components/responses/Error' }
  /auth/register:
    post: { summary: Register a customer account, tags: [Auth], security: [], responses: { '201': { description: Created }, '400': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } } }
  /auth/logout:
    post: { summary: End the current session, tags: [Auth], responses: { '204': { description: Logged out } } }
  /auth/me:
    get: { summary: Current user, tags: [Auth], responses: { '200': { description: Current user }, '401': { $ref: '#/components/responses/Error' } } }
  /products:
    get:
      summary: List products
      tags: [Catalog]
      security: []
      parameters:
        - { name: category, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [price_asc, price_desc, name] } }
        - { name: minPrice, in: query, schema: { type: number } }
        - { name: maxPrice, in: query, schema: { type: number } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }
      responses: { '200': { description: Paged product list }, '400': { $ref: '#/components/responses/Error' } }
  /products/{id}:
    get: { summary: Product detail, tags: [Catalog], security: [], parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: Product }, '404': { $ref: '#/components/responses/Error' } } }
  /categories:
    get: { summary: List categories, tags: [Catalog], security: [], responses: { '200': { description: Category names } } }
  /cart:
    get: { summary: Get cart, tags: [Cart], responses: { '200': { description: Cart, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } } } }
  /cart/items:
    post:
      summary: Add item to cart
      tags: [Cart]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CartItemRequest' } } } }
      responses: { '201': { description: Updated cart }, '400': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
  /cart/items/{productId}:
    patch: { summary: Update quantity (0 removes), tags: [Cart], parameters: [{ name: productId, in: path, required: true, schema: { type: string } }], responses: { '200': { description: Updated cart }, '400': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } } }
    delete: { summary: Remove item, tags: [Cart], parameters: [{ name: productId, in: path, required: true, schema: { type: string } }], responses: { '200': { description: Updated cart }, '404': { $ref: '#/components/responses/Error' } } }
  /checkout/quote:
    post: { summary: Price the cart (subtotal, discount, shipping, tax, total), tags: [Checkout], responses: { '200': { description: Quote }, '400': { $ref: '#/components/responses/Error' } } }
  /checkout:
    post:
      summary: Place an order and authorize payment
      tags: [Checkout, Payments]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CheckoutRequest' } } } }
      responses:
        '201': { description: Order placed, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '402': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '504': { $ref: '#/components/responses/Error' }
  /orders:
    get: { summary: List my orders, tags: [Orders], responses: { '200': { description: Orders, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Order' } } } } } } }
  /orders/{id}:
    get: { summary: Get my order, tags: [Orders], parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: Order, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }, '404': { $ref: '#/components/responses/Error' } } }
  /orders/{id}/cancel:
    post: { summary: Cancel a PENDING or PAID order, tags: [Orders], parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: Cancelled order }, '409': { $ref: '#/components/responses/Error' } } }
  /profile:
    get: { summary: Get profile, tags: [Profile], responses: { '200': { description: Profile } } }
    put: { summary: Update name or tax region, tags: [Profile], responses: { '200': { description: Profile }, '400': { $ref: '#/components/responses/Error' } } }
  /profile/addresses:
    post: { summary: Add an address, tags: [Profile], responses: { '201': { description: Address }, '400': { $ref: '#/components/responses/Error' } } }
  /admin/orders:
    get: { summary: List all orders (admin), tags: [Admin], responses: { '200': { description: Orders }, '403': { $ref: '#/components/responses/Error' } } }
  /admin/orders/{id}/status:
    patch: { summary: Change order status (admin), tags: [Admin], parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: Order }, '409': { $ref: '#/components/responses/Error' } } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  responses:
    Error:
      description: Error
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    Error:
      type: object
      properties: { error: { type: object, properties: { code: { type: string }, message: { type: string } } } }
    LoginRequest:
      type: object
      required: [email, password]
      properties: { email: { type: string, format: email }, password: { type: string } }
    CartItemRequest:
      type: object
      required: [productId]
      properties: { productId: { type: string }, qty: { type: integer, minimum: 1, maximum: 10, default: 1 } }
    Cart:
      type: object
      properties:
        items: { type: array, items: { type: object, properties: { productId: { type: string }, name: { type: string }, unitPrice: { type: number }, qty: { type: integer }, lineTotal: { type: number } } } }
        itemCount: { type: integer }
        subtotal: { type: number }
    CheckoutRequest:
      type: object
      properties:
        cardToken: { type: string }
        promoCode: { type: string }
        region: { type: string, enum: [US-CA, US-NY, US-TX, US-WA, US-OR] }
        express: { type: boolean, description: Uses saved card. Requires feature flag expressCheckout. }
    Order:
      type: object
      required: [id, status, items, subtotal, tax, total]
      properties:
        id: { type: string }
        status: { type: string, enum: [PENDING, PAID, PAYMENT_FAILED, SHIPPED, DELIVERED, CANCELLED] }
        items: { type: array, items: { type: object } }
        subtotal: { type: number }
        discount: { type: number }
        shipping: { type: number }
        tax: { type: number }
        total: { type: number }
        promoCode: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
